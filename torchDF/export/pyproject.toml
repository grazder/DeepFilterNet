[project]
name = "torchdf-export"
version = "0.1.0"
requires-python = ">=3.10,<3.12"
dependencies = [
    "appdirs>=1.4,<2",
    "deepfilterlib==0.5.6",
    "loguru>=0.5",
    "numpy>=1.22,<2",
    "onnx==1.16.2",
    "onnxruntime==1.17.3",
    "onnxsim>=0.4.33,<0.5",
    "packaging",
    "requests>=2.27,<3",
    "sympy",
    "torch==2.1.0",
    "torchaudio==2.1.0",
    "tqdm>=4.65,<5",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]
torchaudio = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
